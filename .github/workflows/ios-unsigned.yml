name: Build iOS (unsigned IPA)

# Builds the iPhone/iPad app on a GitHub macOS runner and packages it WITHOUT code
# signing and WITHOUT game assets. Sign + install the resulting .ipa yourself
# (e.g. Sideloadly / AltStore with your own Apple ID) and add your own game files.

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - name: Checkout (with DXVK submodule)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Init DXVK fork submodule
        run: git submodule update --init --recursive --depth 1 references/fbraz3-dxvk

      - name: Patch DXVK - static vertex strides (iOS 16 lacks VK_DYNAMIC_STATE_VERTEX_INPUT_BINDING_STRIDE)
        run: |
          F=references/fbraz3-dxvk/src/dxvk/dxvk_context.cpp
          grep -n "bool newDynamicStrides = true;" "$F"
          sed -i.bak 's/bool newDynamicStrides = true;/bool newDynamicStrides = false; \/\/ iOS16: MoltenVK has no dynamic vertex stride/' "$F"
          grep -n "bool newDynamicStrides" "$F"
          diff "$F.bak" "$F" || true

      - name: Setup vcpkg (full clone; shallow clones break manifest baselines)
        run: |
          git clone https://github.com/microsoft/vcpkg "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Install build tools
        run: |
          brew update
          brew install cmake ninja meson pkg-config xcodegen glslang
          brew install autoconf autoconf-archive automake libtool
          cmake --version | head -1; ninja --version; meson --version; xcodegen --version

      - name: Install Vulkan SDK (LunarG)
        run: |
          VER=1.4.341.1
          URL="https://sdk.lunarg.com/sdk/download/$VER/mac/vulkansdk-macos-$VER.zip"
          SHA=632cbe96c8ed6ed00c6ce25e3a7738c466134f76586e1c51f1419410d7f9042e
          curl -fL --retry 3 -o /tmp/vk.zip "$URL"
          echo "$SHA  /tmp/vk.zip" | shasum -a 256 -c -
          mkdir -p /tmp/vk && unzip -q -o /tmp/vk.zip -d /tmp/vk
          INSTALLER=$(find /tmp/vk -path '*Contents/MacOS/vulkansdk-macOS-*' -type f | head -1)
          [ -n "$INSTALLER" ] || INSTALLER=$(find /tmp/vk -name 'vulkansdk-macOS-*' -type f | head -1)
          chmod +x "$INSTALLER"
          "$INSTALLER" --root "$HOME/VulkanSDK/$VER" --accept-licenses --default-answer --confirm-command install
          if [ -d "$HOME/VulkanSDK/$VER/macOS" ]; then SDK="$HOME/VulkanSDK/$VER/macOS"; else SDK="$HOME/VulkanSDK/$VER"; fi
          echo "VULKAN_SDK=$SDK" >> "$GITHUB_ENV"
          ls "$SDK" | head

      - name: Stage MoltenVK + fonts
        run: |
          ./scripts/build/ios/fetch-moltenvk.sh
          ./scripts/build/ios/stage-fonts.sh

      - name: Configure (ios-vulkan)
        run: cmake --preset ios-vulkan

      - name: Build engine (z_generals)
        run: cmake --build build/ios-vulkan --target z_generals

      - name: Package unsigned IPA (no assets)
        run: |
          set -euo pipefail
          ROOT="$PWD"
          BUILD="$ROOT/build/ios-vulkan"
          IOS="$ROOT/ios"
          DERIVED="$IOS/build"
          OUT="$ROOT/build/ios-package"
          APP_NAME=GeneralsXZH
          (cd "$IOS" && xcodegen generate --quiet)
          xcodebuild -project "$IOS/$APP_NAME.xcodeproj" -scheme "$APP_NAME" -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" build | tail -5
          SHELL_APP="$DERIVED/Build/Products/Release-iphoneos/$APP_NAME.app"
          test -d "$SHELL_APP"
          rm -rf "$OUT"; mkdir -p "$OUT/Payload"
          cp -R "$SHELL_APP" "$OUT/Payload/"
          APP="$OUT/Payload/$APP_NAME.app"
          cp "$BUILD/GeneralsMD/GeneralsXZH.app/GeneralsXZH" "$APP/$APP_NAME"
          mkdir -p "$APP/Frameworks"
          DXVK="$BUILD/_deps/dxvk-build-macos"
          for lib in \
            "$DXVK/src/d3d8/libdxvk_d3d8.0.dylib" \
            "$DXVK/src/d3d9/libdxvk_d3d9.0.dylib" \
            "$BUILD/_deps/sdl3-build/libSDL3.0.dylib" \
            "$BUILD/_deps/sdl3_image-build/libSDL3_image.0.dylib" \
            "$BUILD/_deps/openal_soft-build/libopenal.1.24.2.dylib" \
            "$BUILD/libgamespy.dylib"; do
            if [ -f "$lib" ]; then cp "$lib" "$APP/Frameworks/"; echo "embedded $(basename "$lib")"; else echo "missing (may be optional): $lib"; fi
          done
          [ -f "$APP/Frameworks/libopenal.1.24.2.dylib" ] && mv "$APP/Frameworks/libopenal.1.24.2.dylib" "$APP/Frameworks/libopenal.1.dylib" || true
          cp -R "$HOME/GeneralsX/MoltenVK/MoltenVK/MoltenVK/dynamic/MoltenVK.xcframework/ios-arm64/MoltenVK.framework" "$APP/Frameworks/"
          # Game config + fonts (no copyrighted assets)
          mkdir -p "$APP/GameData/fonts"
          cp "$HOME/GeneralsX/ios-staging/fonts/"*.ttf "$APP/GameData/fonts/"
          cp "$IOS/config/dxvk.conf" "$APP/GameData/dxvk.conf"
          cp "$IOS/config/Options.ini" "$APP/GameData/DefaultOptions.ini"
          install_name_tool -add_rpath "@executable_path/Frameworks" "$APP/$APP_NAME" 2>/dev/null || true
          (cd "$OUT" && zip -qry GeneralsXZH-unsigned.ipa Payload)
          ls -lh "$OUT/GeneralsXZH-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GeneralsXZH-unsigned-ipa-lansweep
          path: build/ios-package/GeneralsXZH-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
